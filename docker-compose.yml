services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ordering-system-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ordering_system?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_TTL_SECONDS: 300
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: ordering-system
      KAFKA_GROUP_ID: ordering-system-consumer
      KAFKA_ORDER_CREATED_TOPIC: order.created
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - ordering-network

  postgres:
    image: postgres:16-alpine
    container_name: ordering-system-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ordering_system
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ordering_system"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ordering-network

  redis:
    image: redis:7-alpine
    container_name: ordering-system-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ordering-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: ordering-system-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ordering-network

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: ordering-system-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - ordering-network

volumes:
  postgres-data:
  redis-data:

networks:
  ordering-network:
    driver: bridge
